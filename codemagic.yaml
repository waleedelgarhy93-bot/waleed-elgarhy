workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.example.samalout_security"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/app/local.properties" || true
      - name: Generate Gradle Wrapper
        script: |
          cd "$CM_BUILD_DIR"
          gradle wrapper --gradle-version 8.4 --distribution-type bin || true
          chmod +x gradlew
          ls -la gradlew*
      - name: Build Debug APK
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - waleedelgarhy93@gmail.com
        notify:
          success: true
          failure: true
